server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.usdz$ {
        types {
            model/vnd.usdz+zip usdz;
        }
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff;
    }
}
