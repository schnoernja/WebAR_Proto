<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WebAR Prototype</title>
<link rel="stylesheet" href="styles.css">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <!-- AR.js for A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/ar.js@4.3.2/aframe/build/aframe-ar-nft.js"></script>
  </head>

  <body>

    <!-- Intro / Info Overlay -->
    <div id="introOverlay">
      <div id="introCard">
        <h1>Willkommen zur WebAR-Demo</h1>
        <p>
          Dies ist ein prototypisches browserbasiertes AR-System.
          <br><br>
          Platzhaltertext:  
          Hier werden später Informationen zur Nutzung, zu Datenschutz,
          zur Umgebung (z. B. „Bitte im Freien verwenden“) oder Hinweise
          zur Studie angezeigt.
        </p>
        <button id="enterApp">Weiter</button>
      </div>
    </div>

    <!-- UI Overlay -->
    <div id="ui">
      <div id="panel">
        <h2>WebAR Steuerung</h2>
        <button id="startAR">AR starten</button>
        <div id="status">Status: Bereit</div>
      </div>
    </div>

    <!-- AR Scene -->
    <a-scene
      id="arScene"
      embedded
      vr-mode-ui="enabled: false"
      renderer="alpha: true; antialias: true"
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <a-entity light="type: ambient; intensity: 1.0"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="1 2 1"></a-entity>

      <a-box
        position="0 0 -2"
        width="0.5"
        height="0.5"
        depth="0.5"
        color="red"
      ></a-box>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const introOverlay = document.getElementById('introOverlay');
      const enterBtn = document.getElementById('enterApp');

      const startBtn = document.getElementById('startAR');
      const scene = document.getElementById('arScene');
      const status = document.getElementById('status');

      enterBtn.addEventListener('click', () => {
        introOverlay.style.display = 'none';
      });

      startBtn.addEventListener('click', () => {
        status.textContent = 'Status: Kamera wird gestartet...';
        scene.style.display = 'block';
        startBtn.disabled = true;
        startBtn.textContent = 'AR läuft';
      });
    </script>

  </body>
</html>
