<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WebsiteProto</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-gps-camera/dist/aframe-gps-camera.min.js"></script>
  <script src="https://unpkg.com/aframe-gps-entity-place/dist/aframe-gps-entity-place.min.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
  <!-- permission button (needed for iOS deviceorientation + geolocation + camera) -->
  <button id="request-perms" style="position: absolute; z-index: 999; left: 10px; top: 10px; padding: 10px;">
    Enable Location & Motion
  </button>

  <a-scene vr-mode-ui="enabled: false" embedded>
    <!-- gps-camera provides user's geolocation & will align scene objects -->
    <a-camera gps-camera rotation-reader wasd-controls-enabled="false"></a-camera>
  </a-scene>

  <script>
    // Permissions + compact debug panel + model loading
    const btn = document.getElementById('request-perms');

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Requesting permissions...';

      // 1) DeviceOrientation (iOS)
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          await DeviceOrientationEvent.requestPermission();
          console.log('DeviceOrientation permission requested');
        } catch (err) {
          console.warn('DeviceOrientation permission denied or unavailable', err);
        }
      }

      // 2) Geolocation
      if (navigator.geolocation) {
        try {
          await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 8000 });
          });
          console.log('Geolocation permission granted');
        } catch (err) {
          console.warn('Geolocation permission error:', err);
        }
      } else {
        console.warn('Geolocation not supported');
      }

      // 3) Camera (explicit request so browser prompts)
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          stream.getTracks().forEach(t => t.stop());
          console.log('Camera permission granted (probe)');
        } catch (err) {
          console.warn('Camera permission denied or unavailable', err);
        }
      } else {
        console.warn('getUserMedia not supported');
      }

      // hide button and load
      btn.style.display = 'none';
      loadCityModelsFromFile();
    });

    // Helper: get lat/lon fields compatible with different JSON shapes
    function getLat(m) { return (m.latitude !== undefined) ? m.latitude : (m.lat !== undefined ? m.lat : null); }
    function getLon(m) { return (m.longitude !== undefined) ? m.longitude : (m.lon !== undefined ? m.lon : null); }

    async function loadCityModelsFromFile() {
      try {
        const resp = await fetch('models/models_filtered_matched_wgs84.json');
        const list = await resp.json();
        const scene = document.querySelector('a-scene');

        list.forEach(m => {
          const lat = getLat(m);
          const lon = getLon(m);
          if (lat == null || lon == null || !m.url) return;

          const ent = document.createElement('a-entity');
          ent.setAttribute('gps-entity-place', `latitude: ${lat}; longitude: ${lon};`);
          ent.setAttribute('gltf-model', `url(${m.url})`);
          ent.setAttribute('scale', `${(m.scale||1)} ${(m.scale||1)} ${(m.scale||1)}`);

          ent.addEventListener('model-loaded', () => {
            try {
              // try standard mesh/model objects
              const obj = ent.getObject3D('mesh') || ent.getObject3D('model') || ent.object3D;
              if (!obj) {
                addDebugLine(m.id || m.url, 'No mesh found');
                return;
              }

              // compute bounding box center (world)
              const box = new THREE.Box3().setFromObject(obj);
              const centerWorld = new THREE.Vector3();
              box.getCenter(centerWorld);

              // world origin of entity (entity position)
              const worldOrigin = new THREE.Vector3();
              ent.object3D.getWorldPosition(worldOrigin);

              // offset vector from entity origin to geometry center (world coords)
              const offsetVec = new THREE.Vector3().subVectors(centerWorld, worldOrigin);

              // convert to meters: A-Frame/three units ~= meters in gps-entity-place
              const eastMeters = offsetVec.x;
              const northMeters = -offsetVec.z; // negative Z typical in A-Frame mapping
              const vertMeters = offsetVec.y;
              const distanceMeters = Math.sqrt(eastMeters*eastMeters + northMeters*northMeters);

              // reference latitude for lon/deg conversion
              const cam = document.querySelector('[gps-camera]');
              const camComp = cam && (cam.components?.gpsCamera);
              const camLat = camComp?.currentLatitude || null;
              const refLat = camLat || parseFloat(lat);

              const dLat = northMeters / metersPerDegLat();
              const dLon = eastMeters / metersPerDegLon(refLat);
              const suggestedLat = parseFloat(lat) + dLat;
              const suggestedLon = parseFloat(lon) + dLon;

              const html = `
                Expected: ${parseFloat(lat).toFixed(6)}, ${parseFloat(lon).toFixed(6)}<br>
                Offset (m): E:${eastMeters.toFixed(2)} N:${northMeters.toFixed(2)} V:${vertMeters.toFixed(2)}<br>
                Distance (m): ${distanceMeters.toFixed(2)}<br>
                Suggested corrected coords: ${suggestedLat.toFixed(6)}, ${suggestedLon.toFixed(6)}<br>
                Model URL: ${m.url}
              `;
              addDebugLine(m.id || m.url, html);

              // small visual marker at bounding-box center (relative to entity origin)
              const marker = document.createElement('a-sphere');
              marker.setAttribute('radius', '0.5');
              marker.setAttribute('color', '#00ff00');
              marker.setAttribute('position', `${offsetVec.x} ${offsetVec.y} ${offsetVec.z}`);
              marker.setAttribute('visible', 'true');
              ent.appendChild(marker);
            } catch (err) {
              addDebugLine(m.id || m.url, 'Debug error: ' + (err.message || err));
              console.error(err);
            }
          }, { once: true });

          scene.appendChild(ent);
        });
      } catch (e) {
        console.error('Failed to load models.json', e);
      }
    }

    // Desktop fallback: if DeviceOrientation doesn't require permission, load immediately for easier testing
    if (!('requestPermission' in DeviceOrientationEvent)) {
      // do NOT hide the permission button; let user still click it to request camera if needed
      loadCityModelsFromFile();
    }

    // Compact debug panel (toggle)
    (function createDebugPanel(){
      const wrapper = document.createElement('div');
      wrapper.id = 'debugWrapper';
      wrapper.style.cssText = 'position:fixed;right:10px;bottom:10px;z-index:9999;font-family:monospace;';

      const toggle = document.createElement('button');
      toggle.id = 'debugToggle';
      toggle.textContent = 'Debug ▶';
      toggle.style.cssText = 'background:#222;color:#fff;border:none;padding:6px 8px;border-radius:4px;cursor:pointer;opacity:0.9;';
      wrapper.appendChild(toggle);

      const panel = document.createElement('div');
      panel.id = 'debugPanel';
      panel.style.cssText = 'display:none;width:320px;max-height:38vh;overflow:auto;background:rgba(0,0,0,0.75);color:#fff;padding:8px;border-radius:6px;margin-top:6px;font-size:12px;';
      panel.innerHTML = '<b>Model Debug</b><div id="debugList" style="margin-top:6px;"></div>';
      wrapper.appendChild(panel);

      toggle.addEventListener('click', () => {
        if (panel.style.display === 'none') {
          panel.style.display = 'block';
          toggle.textContent = 'Debug ▼';
        } else {
          panel.style.display = 'none';
          toggle.textContent = 'Debug ▶';
        }
      });

      document.body.appendChild(wrapper);
    })();

    // helpers
    function metersPerDegLat() { return 110574; } // approximate
    function metersPerDegLon(lat) { return 111320 * Math.cos(lat * Math.PI/180); }

    function addDebugLine(id, html) {
      const list = document.getElementById('debugList');
      if (!list) return;
      const el = document.createElement('div');
      el.style.marginBottom = '6px';
      el.innerHTML = `<div><b>${id}</b></div>${html}`;
      list.appendChild(el);
      // keep panel from growing unlimited
      while (list.children.length > 60) list.removeChild(list.firstChild);
    }

    // simple A-Frame component to read camera rotation (debug)
    AFRAME.registerComponent('rotation-reader', {
      tick: function () {
        // intentionally left mostly silent to avoid spam
      }
    });
  </script>
</body>
</html>
