<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AR Cube Test</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <!-- AR.js for A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/ar.js@4.3.2/aframe/build/aframe-ar-nft.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      #hint {
        position: fixed;
        left: 10px;
        top: 10px;
        z-index: 9999;
        background: rgba(0,0,0,0.6);
        color: white;
        padding: 8px 10px;
        border-radius: 8px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div id="hint">
      Wenn die Kamera startet, solltest du einen roten Würfel sehen (ca. 2m vor dir).
      <br/>Tipp: Handy langsam bewegen.
    </div>

    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="alpha: true; antialias: true"
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <!-- Licht ist wichtig, sonst wirkt vieles “schwarz” -->
      <a-entity light="type: ambient; intensity: 1.0"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="1 2 1"></a-entity>

      <!-- Der Würfel: 2 Meter vor der Kamera -->
      <a-box
        position="0 0 -2"
        width="0.5"
        height="0.5"
        depth="0.5"
        color="red"
      ></a-box>

      <!-- Kamera: AR.js steuert die Pose -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
