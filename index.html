<!DOCTYPE html>
<html lang="de">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WebAR Test</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body style="margin: 0; overflow: hidden;">

    <!-- GPS Debug Overlay -->
    <div id="gps-debug">
      <div id="gps-header">
        <span>GPS Debug</span>
        <button id="gps-toggle">−</button>
      </div>
      <div id="gps-content">
        <div>Latitude: <span id="lat">–</span></div>
        <div>Longitude: <span id="lon">–</span></div>
        <div>Accuracy: <span id="acc">–</span> m</div>
      </div>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;">
      <a-box position="0 0 -3" depth="1" height="1" width="1" color="red"></a-box>

      <!-- Kamera mit GPS & Orientation -->
      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <!-- GPS Debug Logic -->
    <script src="gps-debug.js"></script>
  </body>

</html>
