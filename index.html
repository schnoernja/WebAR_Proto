<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WebsiteProto</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-gps-camera/dist/aframe-gps-camera.min.js"></script>
  <script src="https://unpkg.com/aframe-gps-entity-place/dist/aframe-gps-entity-place.min.js"></script>
  <style>
    /* UI */
    #cameraFeed { pointer-events: none; z-index:-10; position:fixed; left:0; top:0; width:100%; height:100%; object-fit:cover; background:#000; }
    a-scene { z-index:1; position:relative; }
    #deviceCoordsBox { position: fixed; left: 10px; top: 56px; z-index: 10001; background: rgba(0,0,0,0.6); color:#fff; padding:6px 8px; border-radius:6px; font-family: monospace; font-size:12px; max-width:260px; cursor:pointer; }
    #deviceCoordsBox.collapsed { height: 28px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #statusBox { position: fixed; left: 10px; top: 120px; z-index: 10000; background: rgba(0,0,0,0.6); color:#fff; padding:6px 8px; border-radius:6px; font-family: monospace; font-size:12px; max-width:320px; max-height:40vh; overflow:auto; }
    /* big permission overlay to ensure a clear user gesture on mobile */
    #permOverlay { position: fixed; left:0; top:0; right:0; bottom:0; z-index:2147483647; display:flex; align-items:center; justify-content:center; background: rgba(0,0,0,0.35); }
    #permCard { background: #111; color:#fff; padding:18px; border-radius:10px; text-align:center; width:90%; max-width:420px; box-shadow:0 6px 20px rgba(0,0,0,0.6); font-family:system-ui,Segoe UI,Helvetica,Arial; }
    #permCard button { margin-top:12px; padding:12px 18px; font-size:16px; border-radius:6px; border:none; background:#0078d4; color:#fff; cursor:pointer; }
    #permCard .hint { font-size:13px; color:#ddd; margin-top:8px; }
    /* debug toggle */
    #debugWrapper button { font-family: monospace; }
  </style>
</head>
<body style="margin:0; overflow:hidden; background:transparent;">
  <video id="cameraFeed" autoplay muted playsinline></video>

  <div id="permOverlay">
    <div id="permCard" role="dialog" aria-modal="true">
      <div style="font-weight:600;font-size:18px">Enable Camera & Location</div>
      <div class="hint">Tap the button to allow camera, motion and location access. This must be done once to start AR view.</div>
      <button id="request-perms">Enable Location & Motion</button>
      <div id="permStatus" class="hint" style="margin-top:8px"></div>
    </div>
  </div>

  <div id="deviceCoordsBox" class="collapsed" title="Tap to expand/collapse">Device coords: unknown (tap to expand)</div>
  <div id="statusBox"><b>Status</b><div id="statusLines" style="margin-top:6px"></div></div>

  <a-scene renderer="alpha: true" vr-mode-ui="enabled: false" embedded>
    <a-camera gps-camera rotation-reader wasd-controls-enabled="false"></a-camera>
  </a-scene>

  <script>
  (function(){
    /* --- helpers --- */
    function statusLog(msg){
      console.log(msg);
      const list = document.getElementById('statusLines');
      if(!list) return;
      const el = document.createElement('div'); el.textContent = msg; list.appendChild(el);
      while(list.children.length > 80) list.removeChild(list.firstChild);
    }
    function setPermStatus(msg){ const p = document.getElementById('permStatus'); if(p) p.textContent = msg; }
    function formatNum(n,d=6){ return (typeof n === 'number') ? n.toFixed(d) : String(n); }

    /* device coords UI */
    const devBox = document.getElementById('deviceCoordsBox');
    devBox.addEventListener('click', ()=> {
      devBox.classList.toggle('collapsed');
      if (devBox.classList.contains('collapsed')) {
        devBox.innerHTML = 'Device coords: ' + (devBox.dataset.simple || 'unknown') + ' (tap to expand)';
      }
    });

    /* geolocation watch + current pos */
    let geoWatchId = null;
    let currentDevicePos = null;
    function startDeviceWatch(){
      if(!navigator.geolocation){ statusLog('Geolocation not supported'); updateDeviceCoordsDisplay(null); return; }
      if(geoWatchId !== null) return;
      geoWatchId = navigator.geolocation.watchPosition(pos=>{
        statusLog('Geolocation update: ' + pos.coords.latitude.toFixed(6) + ', ' + pos.coords.longitude.toFixed(6) + ' (acc ' + pos.coords.accuracy + 'm)');
        currentDevicePos = { latitude: pos.coords.latitude, longitude: pos.coords.longitude, accuracy: pos.coords.accuracy };
        devBox.dataset.simple = pos.coords.latitude.toFixed(6) + ', ' + pos.coords.longitude.toFixed(6);
        if (devBox.classList.contains('collapsed')) {
          devBox.innerHTML = 'Device coords: ' + devBox.dataset.simple + ' (tap to expand)';
        } else {
          updateDeviceCoordsDisplay(pos);
        }
      }, err=>{
        statusLog('Geolocation watch error: ' + (err.message||err.code));
        currentDevicePos = null;
        updateDeviceCoordsDisplay(null);
      }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 8000 });
      statusLog('Started geolocation watch (id=' + geoWatchId + ')');
    }
    function updateDeviceCoordsDisplay(pos){
      const el = document.getElementById('deviceCoordsBox');
      if(!el) return;
      if(!pos){ el.innerHTML = 'Device coords: unavailable (tap to expand)'; return; }
      const lat = pos.coords.latitude, lon = pos.coords.longitude, acc = pos.coords.accuracy;
      el.innerHTML = '<div style="font-weight:bold">Device</div>' +
        'latitude: ' + formatNum(lat,6) + ', longitude: ' + formatNum(lon,6) + '<br>' +
        'accuracy: ' + formatNum(acc,1) + ' m<br>' +
        '<small>tap to collapse</small>';
    }

    /* haversine */
    function haversine(lat1, lon1, lat2, lon2){
      const R = 6371000; const toRad = v => v * Math.PI/180;
      const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    /* permission flow - must be invoked by user gesture */
    const permButton = document.getElementById('request-perms');
    const permOverlay = document.getElementById('permOverlay');
    const videoEl = document.getElementById('cameraFeed');

    async function requestPermissionsFlow(){
      setPermStatus('Starting permission requests...');
      statusLog('User initiated permission flow');

      // 1) DeviceOrientation (iOS) - needs explicit request
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          setPermStatus('Requesting motion/orientation...');
          const res = await DeviceOrientationEvent.requestPermission();
          statusLog('DeviceOrientation.requestPermission -> ' + res);
          setPermStatus('Motion/orientation: ' + res);
        } catch (err) {
          statusLog('DeviceOrientation permission denied/unavailable: ' + (err && err.message));
          setPermStatus('Motion/orientation denied');
        }
      } else {
        statusLog('DeviceOrientation.requestPermission not required or unavailable');
      }

      // 2) Camera (getUserMedia) - will prompt on secure origin
      let gotStream = false;
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          setPermStatus('Requesting camera...');
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          videoEl.srcObject = stream;
          await videoEl.play().catch(()=>{});
          gotStream = true;
          statusLog('Camera stream active');
          setPermStatus('Camera: granted');
        } catch (err) {
          statusLog('Camera permission denied or error: ' + (err && err.message));
          setPermStatus('Camera denied or error');
        }
      } else {
        statusLog('getUserMedia not supported');
        setPermStatus('Camera not supported');
      }

      // 3) Geolocation - trigger a getCurrentPosition to prompt
      let geoOk = false;
      if (navigator.geolocation) {
        try {
          setPermStatus('Requesting location...');
          await new Promise((res,rej) => navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy:true, timeout:10000 }));
          geoOk = true;
          statusLog('Geolocation initial position obtained');
          setPermStatus('Location: granted');
        } catch (err) {
          statusLog('Geolocation permission denied/error: ' + (err && err.message));
          setPermStatus('Location denied or error');
        }
      } else {
        statusLog('Geolocation not supported');
        setPermStatus('Location not supported');
      }

      // If none granted, show instructions
      if(!gotStream && !geoOk){
        setPermStatus('No permissions granted. Please enable camera and location in browser settings and reload.');
        // keep overlay visible so user can retry
        return;
      }

      // success (at least partially) -> hide overlay and start watchers/loaders
      permOverlay.style.display = 'none';
      startDeviceWatch();
      loadCityModelsFromFile();
    }

    // robust permission button handler
    let __permInProgress = false;
    async function handlePermButtonEvent(e){
      try { if (e && e.preventDefault) e.preventDefault(); } catch(e){}
      if (__permInProgress) return;
      __permInProgress = true;
      permButton.disabled = true;
      setPermStatus('Starting permission flow...');
      statusLog('Permission button pressed');
      try {
        await requestPermissionsFlow();
      } catch (err) {
        console.error('requestPermissionsFlow error', err);
        statusLog('Permission flow error: ' + (err && err.message));
        setPermStatus('Error: ' + (err && err.message));
      } finally {
        __permInProgress = false;
        permButton.disabled = false;
      }
    }

    // attach multiple input events to maximize chance of firing on mobile
    permButton.addEventListener('click', handlePermButtonEvent, { passive:false });
    permButton.addEventListener('touchend', handlePermButtonEvent, { passive:false });
    permButton.addEventListener('pointerdown', handlePermButtonEvent, { passive:false });

    /* --- model loader (large test cubes) --- */
    function getLat(m){ return (m.latitude !== undefined) ? m.latitude : (m.lat !== undefined ? m.lat : null); }
    function getLon(m){ return (m.longitude !== undefined) ? m.longitude : (m.lon !== undefined ? m.lon : null); }

    async function loadCityModelsFromFile(){
      statusLog('Starting to load models JSON...');
      try {
        // try both common filename locations (models/ or Models/) for robustness
        let resp = null;
        try { resp = await fetch('models/models_filtered_matched_wgs84.json'); } catch(e) { /* ignore */ }
        if (!resp || !resp.ok) {
          try { resp = await fetch('Models/models_filtered_matched_wgs84.json'); } catch(e) { /* ignore */ }
        }
        if (!resp || !resp.ok) {
          statusLog('Failed to fetch models JSON from models/ or Models/ (HTTP ' + (resp?resp.status:'no response') + ')');
          setPermStatus('Could not load models JSON; check path on server');
          return;
        }

        const list = await resp.json();
        statusLog('Loaded models JSON, entries: ' + list.length);
        const scene = document.querySelector('a-scene');
        if(!window.___cubeDistanceUpdaters) window.___cubeDistanceUpdaters = [];

        for(const m of list){
          const lat = getLat(m), lon = getLon(m);
          if(lat == null || lon == null){ statusLog('Skipping entry missing lat/lon'); continue; }
          statusLog('Processing @ ' + lat + ',' + lon);

          const cube = document.createElement('a-box');
          cube.setAttribute('gps-entity-place', 'latitude: ' + lat + '; longitude: ' + lon + ';');
          cube.setAttribute('width', 5);
          cube.setAttribute('height', 5);
          cube.setAttribute('depth', 5);
          cube.setAttribute('color', '#ff0000');
          cube.setAttribute('opacity', 0.95);

          // set position so the cube rests on the ground (half height)
          cube.setAttribute('position', '0 1 0');

          const label = document.createElement('a-text');
          label.setAttribute('align', 'center');
          label.setAttribute('position', '0 1.6 0');
          label.setAttribute('color', '#ffffff');
          label.setAttribute('side', 'double');
          const idText = m.id || '';
          label.setAttribute('value', idText + '\n' + 'dist: ? m');
          cube.appendChild(label);

          // disable frustum culling for inner meshes to avoid accidental disappearance
          cube.addEventListener('loaded', ()=> {
            try {
              cube.object3D.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
              statusLog('cube-loaded and frustumCulling disabled @ ' + lat + ',' + lon);
            } catch(e) {
              statusLog('cube loaded, but failed to disable frustumCulling: ' + e);
            }
          }, { once:true });

          window.___cubeDistanceUpdaters.push({ cube: cube, lat: parseFloat(lat), lon: parseFloat(lon), label: label });
          scene.appendChild(cube);
        }
      } catch (err) {
        statusLog('Failed to load models JSON: ' + (err && err.message));
      }
    }

    /* update distances to cubes */
    setInterval(()=>{
      if(!window.___cubeDistanceUpdaters || !currentDevicePos) return;
      for(const u of window.___cubeDistanceUpdaters){
        const d = haversine(currentDevicePos.latitude, currentDevicePos.longitude, u.lat, u.lon);
        const txt = (d <= 10000) ? Math.round(d) + ' m' : '>10000 m';
        const firstLine = (u.label && u.label.getAttribute('value') || '').split('\n')[0] || '';
        u.label.setAttribute('value', firstLine + '\n' + 'dist: ' + txt);
        const color = d <= 20 ? '#00aa00' : (d <= 50 ? '#ffaa00' : '#ff0000');
        // ensure cube exists before setting color
        try { if (u.cube) u.cube.setAttribute('color', color); } catch(e){}
      }
    }, 1500);

    /* remove automatic loads: require explicit user gesture on mobile for permissions */
    /* NOTE: do NOT auto-start permission flow; user must tap the overlay button */

    /* debug panel (toggle) */
    (function createDebugPanel(){
      const wrapper = document.createElement('div'); wrapper.id='debugWrapper'; wrapper.style.cssText='position:fixed;right:10px;bottom:10px;z-index:9999;font-family:monospace;';
      const toggle = document.createElement('button'); toggle.id='debugToggle'; toggle.textContent='Debug ▶'; toggle.style.cssText='background:#222;color:#fff;border:none;padding:6px 8px;border-radius:4px;cursor:pointer;opacity:0.9;';
      wrapper.appendChild(toggle);
      const panel = document.createElement('div'); panel.id='debugPanel'; panel.style.cssText='display:none;width:320px;max-height:38vh;overflow:auto;background:rgba(0,0,0,0.75);color:#fff;padding:8px;border-radius:6px;margin-top:6px;font-size:12px;';
      panel.innerHTML = '<b>Model Debug</b><div id="debugList" style="margin-top:6px"></div>';
      wrapper.appendChild(panel);
      toggle.addEventListener('click', ()=>{ if(panel.style.display==='none'){ panel.style.display='block'; toggle.textContent='Debug ▼'; } else { panel.style.display='none'; toggle.textContent='Debug ▶'; }});
      document.body.appendChild(wrapper);
    })();

    function addDebugLine(id, html){
      const list = document.getElementById('debugList');
      if(list){ const el = document.createElement('div'); el.style.marginBottom='6px'; el.innerHTML = '<div><b>' + id + '</b></div>' + html; list.appendChild(el); while(list.children.length>60) list.removeChild(list.firstChild); }
      statusLog((id ? id + ': ' : '') + html.replace(/<[^>]+>/g,' '));
    }

    // register rotation-reader only if not already registered
    if (window.AFRAME && (!AFRAME.components || !AFRAME.components['rotation-reader'])) {
      AFRAME.registerComponent('rotation-reader', { tick: function(){} });
    } else {
      console.log('rotation-reader already registered; skipping.');
    }

  })();
  </script>
</body>
</html>
