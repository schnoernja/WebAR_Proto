<!DOCTYPE html>
<html lang="de">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Location-Based WebAR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Look-At Component -->
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <!-- AR.js (Location-based) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <script src="gps-debug.js"></script>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body style="margin: 0; overflow: hidden;">
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >
    <a-box
      id="world-object"
      gps-entity-place="latitude: 50.989135; longitude: 11.022858;"
      material="color: blue"
      scale="5 5 5"
      look-at="[gps-camera]"
    ></a-box>

    <a-camera gps-camera rotation-reader></a-camera>
  </a-scene>

  <div id="gps-debug">
    <div id="gps-header">
      <span>GPS Debug</span>
      <button id="gps-toggle">−</button>
    </div>

    <div id="gps-content">
      <strong>Device</strong>
      <div>Lat: <span id="dev-lat">–</span></div>
      <div>Lon: <span id="dev-lon">–</span></div>

      <hr />

      <strong>Object</strong>
      <div>Lat: <span id="obj-lat">–</span></div>
      <div>Lon: <span id="obj-lon">–</span></div>
    </div>
  </div>

</body>

</html>
