<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Location-Based WebAR (Three.js)</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
<div id="gps-debug">
  <div id="gps-header">
    <span>GPS Debug</span>
    <button id="gps-toggle">タ'</button>
  </div>

  <div id="gps-content">
    <strong>Device</strong>
    <div>Lat: <span id="dev-lat">-</span></div>
    <div>Lon: <span id="dev-lon">-</span></div>
    <div>Ground height (m): <span id="ground-height">-</span></div>
    <div>Height tile: <span id="ground-tile">-</span></div>
    <div id="gps-status">waiting for permission</div>

    <hr />

    <strong>Object</strong>
    <div>Lat: <span id="obj-lat">50.989135</span></div>
    <div>Lon: <span id="obj-lon">11.022858</span></div>
    <div id="obj-distance">Dist: -</div>

    <hr />

    <strong>Test Coordinates</strong>
    <div>
      <label for="test-lat">Lat</label>
      <input id="test-lat" type="number" step="0.000001" placeholder="50.989135" />
    </div>
    <div>
      <label for="test-lon">Lon</label>
      <input id="test-lon" type="number" step="0.000001" placeholder="11.022858" />
    </div>
    <button id="apply-test-coords">Apply</button>

    <hr />

    <strong>Height</strong>
    <div>Y: <span id="obj-height">0.00</span> m</div>
    <div>
      <label for="test-height">Height (m)</label>
      <input id="test-height" type="number" step="0.1" placeholder="0" />
    </div>
    <div>
      <label for="lock-ground">Lock to ground</label>
      <input id="lock-ground" type="checkbox" checked />
    </div>
    <button id="apply-height">Apply Height</button>
    <button id="reset-ahead">Reset 2m Ahead</button>
    <button id="toggle-model">Toggle Model</button>
    <button id="toggle-scale">Toggle Scale</button>
  </div>
</div>

<script type="module" src="webar-three.js"></script>

</body>
</html>
